name: Windows installer

# Membuat Rotiva-Setup-<versi>.exe dan paket Microsoft Store Rotiva-<versi>.msix di CI dengan
# installer/build.ps1 + installer/build-msix.ps1, dengan engine di versi yang dipatok (SHA-256 dicek).
# Paket MSIX lalu dipasang di runner (ditandatangani sertifikat uji sementara) dan diuji: menu klik
# kanan "Convert with Rotiva" → roda → klik MP3 → file hasil harus ada. Paket yang diunggah ke
# Partner Center adalah yang tanpa tanda tangan (Store menandatanganinya sendiri).
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version number (e.g. 1.10.1)
        required: true
      identity_name:
        description: MSIX Package/Identity/Name (Partner Center → Product identity)
        default: DenishChairany.Rotivapro
      publisher:
        description: MSIX Package/Identity/Publisher
        default: CN=EC6B737C-0A8F-438A-B152-CD4F58E170BA
      publisher_display_name:
        description: MSIX Package/Properties/PublisherDisplayName
        default: Denish Chairany
      display_name:
        description: Reserved Store name, exactly as in Partner Center
        required: true

permissions:
  contents: read
  actions: read

env:
  FFMPEG_VERSION: 9.0.2
  FFMPEG_SHA256: 759d0a9831c436a0eb331ad36f236c06cb04aaa0005da46571f0e9d3d9206f6b
  PANDOC_VERSION: 3.12.1
  PANDOC_SHA256: 6ef431cb20b2c24a0371fc19200dc49d452be54b1b5c9239f3462841ef53e587
  LIBREOFFICE_VERSION: 26.8.1.1
  LIBREOFFICE_SHA256: c6298b10cfa1748bcbedad94c62ce771e240e5021bfd6d7a967cd571b04b5312
  INNO_VERSION: 6.7.3
  INNO_SHA256: 9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732

jobs:
  installer:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 8.0.x
      - name: Install build tools and engines
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $dl = Join-Path $env:RUNNER_TEMP 'downloads'
          New-Item -ItemType Directory -Force $dl | Out-Null
          function Get-Pinned($url, $sha256) {
            $file = Join-Path $dl (Split-Path $url -Leaf)
            Invoke-WebRequest $url -OutFile $file
            $actual = (Get-FileHash $file -Algorithm SHA256).Hash
            if ($actual -ne $sha256) { throw "SHA-256 mismatch for ${url}: $actual" }
            return $file
          }

          $zip = Get-Pinned "https://github.com/GyanD/codexffmpeg/releases/download/$env:FFMPEG_VERSION/ffmpeg-$env:FFMPEG_VERSION-full_build.zip" $env:FFMPEG_SHA256
          Expand-Archive $zip $dl
          Move-Item (Join-Path $dl "ffmpeg-$env:FFMPEG_VERSION-full_build") "$env:ProgramFiles\ffmpeg"

          $zip = Get-Pinned "https://github.com/jgm/pandoc/releases/download/$env:PANDOC_VERSION/pandoc-$env:PANDOC_VERSION-windows-x86_64.zip" $env:PANDOC_SHA256
          Expand-Archive $zip $dl
          Move-Item (Join-Path $dl "pandoc-$env:PANDOC_VERSION") "$env:ProgramFiles\Pandoc"

          $msi = Get-Pinned "https://downloadarchive.documentfoundation.org/libreoffice/old/$env:LIBREOFFICE_VERSION/win/x86_64/LibreOffice_$($env:LIBREOFFICE_VERSION)_Win_x86-64.msi" $env:LIBREOFFICE_SHA256
          $p = Start-Process msiexec.exe -ArgumentList '/i', "`"$msi`"", '/qn', '/norestart' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "LibreOffice install failed: $($p.ExitCode)" }

          $inno = Get-Pinned "https://github.com/jrsoftware/issrc/releases/download/is-$($env:INNO_VERSION -replace '\.', '_')/innosetup-$env:INNO_VERSION.exe" $env:INNO_SHA256
          $p = Start-Process $inno -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/ALLUSERS' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Inno Setup install failed: $($p.ExitCode)" }
      - name: Build installer
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File installer\build.ps1 -Version "${{ inputs.version }}"
      - name: Checksum
        shell: pwsh
        run: Get-FileHash dist\Rotiva-Setup-*.exe -Algorithm SHA256 | Format-List Path, Hash
      - id: upload
        uses: actions/upload-artifact@v7
        with:
          name: rotiva-windows-unsigned
          path: dist/Rotiva-Setup-*.exe
          if-no-files-found: error
      - name: Build MSIX
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File installer\build-msix.ps1 -Version "${{ inputs.version }}" `
            -IdentityName "${{ inputs.identity_name }}" -Publisher "${{ inputs.publisher }}" `
            -PublisherDisplayName "${{ inputs.publisher_display_name }}" -DisplayName "${{ inputs.display_name }}"
          Get-FileHash dist\Rotiva-*.msix -Algorithm SHA256 | Format-List Path, Hash
      - uses: actions/upload-artifact@v7
        with:
          name: rotiva-msix-store
          path: dist/Rotiva-*.msix
          if-no-files-found: error
          compression-level: 0
      - name: Install the MSIX with a test certificate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $test = Join-Path $env:RUNNER_TEMP 'msix-test'
          New-Item -ItemType Directory -Force $test | Out-Null
          Copy-Item dist\Rotiva-*.msix (Join-Path $test 'Rotiva-test.msix')
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "${{ inputs.publisher }}" `
            -CertStoreLocation Cert:\CurrentUser\My -TextExtension @('2.5.29.19={text}')
          $pfx = Join-Path $test 'test.pfx'
          $password = ConvertTo-SecureString -String 'rotiva-ci' -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $password | Out-Null
          Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\LocalMachine\TrustedPeople -Password $password | Out-Null
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /fd SHA256 /f $pfx /p rotiva-ci (Join-Path $test 'Rotiva-test.msix')
          if ($LASTEXITCODE -ne 0) { throw 'signtool failed' }
          Add-AppxPackage (Join-Path $test 'Rotiva-test.msix')
          Get-AppxPackage "${{ inputs.identity_name }}" | Format-List Name, Version, InstallLocation, Status
      - name: Test the right-click menu and the wheel
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File installer\msix\test-msix.ps1 -Out (Join-Path $env:RUNNER_TEMP 'msix-shots')
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: msix-test
          path: ${{ runner.temp }}/msix-shots
          if-no-files-found: ignore
