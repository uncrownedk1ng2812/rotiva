name: Build

on:
  push:
    branches: [main]
    paths: ['src/**', 'Rotiva.sln', '.github/workflows/build.yml']
  pull_request:
    paths: ['src/**', 'Rotiva.sln', '.github/workflows/build.yml']

permissions:
  contents: read

jobs:
  # Inti konversi harus tetap lintas platform: dites di ketiga OS.
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 8.0.x
      # Linux: engine untuk test OCR (Tesseract) dan pembuat gambar contohnya (ImageMagick).
      - if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr imagemagick >/dev/null
      - run: dotnet test src/Rotiva.Core.Tests --configuration Release

  # Aplikasi Windows (WPF) hanya bisa di-build di Windows.
  windows-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 8.0.x
      - run: dotnet build src/Rotiva/Rotiva.csproj --configuration Release

  # Rotiva untuk macOS & Linux (Avalonia, pratinjau). Hasil publish disimpan sebagai artifact
  # untuk dicoba; belum ada installer, tanda tangan, atau notarization.
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: macos-latest, rid: osx-arm64 }
          - { os: macos-latest, rid: osx-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 8.0.x
      - run: dotnet publish src/Rotiva.Desktop --configuration Release --runtime ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - uses: actions/upload-artifact@v7
        with:
          name: rotiva-${{ matrix.rid }}
          path: publish
          retention-days: 30
